name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    # Postgres real para los tests de integración (Prisma fija el proveedor: no hay perfil SQLite).
    # Los tests usan el esquema aislado `test` (tests/test-env.ts).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plantilla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: plantilla_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      LOCALHOST: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare test database
        # Esquema `test` + migraciones (sin seeders). Variables dummy de la app: tests/test-env.ts.
        run: npm run db:test:prepare

      - name: Test
        # pretest genera el cliente de Prisma; las variables que la app exige salen de tests/test-env.ts.
        run: npm test
