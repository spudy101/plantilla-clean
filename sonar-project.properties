sonar.projectKey=base-project
sonar.projectName=base-project
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,tests/**/*.ts
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/coverage/**,**/generated/**,**/*.test.ts

sonar.coverage.exclusions=\
  **/tests/**,\
  **/scripts/**,\
  src/config/**,\
  src/app.ts,\
  src/server.ts,\
  src/shared/constants/**,\
  **/docs/**,\
  **/*.routes.ts,\
  **/workers/**
